<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1160 820" width="1160" height="820" role="img"
     aria-labelledby="t1 d1"
     style="background-color:#ffffff; font-family:'Segoe UI',Segoe,Helvetica,Arial,sans-serif;">

  <title id="t1">Static IP gateway for Azure SQL Managed Instance Link</title>
  <desc id="d1">The Service Provider SQL Server resolves the SQL Managed Instance FQDN to 10.0.1.10
  through a client-side hosts override and sends TCP 5022, 1433 and 11000-11999 over a VPN/MPLS
  connection into the customer environment, which forwards the traffic over ExpressRoute to the
     internal Standard Load Balancer in proxy-subnet. The load balancer distributes traffic across
     both members of an active/active HAProxy tier. HAProxy forwards the traffic
  to the Azure SQL Managed Instance in the delegated mi-subnet, independently re-resolving the real
  SQL Managed Instance FQDN through Azure DNS every 10 seconds so it always targets the current
  backend IP address.</desc>

